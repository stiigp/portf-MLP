services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: portf-mlp-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portf-mlp-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
